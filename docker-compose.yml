services:
  segnog:
    image: ghcr.io/rafiksalama/segnog:latest
    ports:
      - "${GRPC_PORT:-50051}:50051"   # gRPC
      - "${PORT:-9000}:9000"          # REST + UI
    environment:
      - MEMORY_SERVICE_REST__HOST=0.0.0.0
      - MEMORY_SERVICE_REST__PORT=9000
      - MEMORY_SERVICE_EMBEDDINGS__API_KEY=${EMBEDDING_API_KEY:-${LLM_API_KEY}}
      - MEMORY_SERVICE_EMBEDDINGS__BASE_URL=${EMBEDDING_BASE_URL:-${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/}}
      - MEMORY_SERVICE_EMBEDDINGS__MODEL=${EMBEDDING_MODEL:-embedding-3}
      - MEMORY_SERVICE_LLM__API_KEY=${LLM_API_KEY}
      - MEMORY_SERVICE_LLM__BASE_URL=${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/}
      - MEMORY_SERVICE_LLM__FLASH_MODEL=${LLM_MODEL:-glm-5}
    volumes:
      - dragonfly_data:/data/dragonfly
      - falkordb_data:/data/falkordb
      - nats_data:/data/nats
    restart: unless-stopped

volumes:
  dragonfly_data:
  falkordb_data:
  nats_data:
